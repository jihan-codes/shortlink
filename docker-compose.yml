services:
  app1:
    build: ./app
    environment:
      NAME: app1
  app2:
    build: ./app
    environment:
      NAME: app2
  app3:
    build: ./app
    environment:
      NAME: app3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2
      - app3
